<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞士蜜月</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1>瑞士蜜月 2025</h1>
  <p class="hero-sub">6月 14日 — 6月 24日 · 11 天 10 夜</p>
</div>

<nav class="tab-bar" id="tabBar" role="tablist" aria-label="行程日期"></nav>
<div class="tab-content" id="tabContent"></div>
<button class="back-top" id="backTop" title="回到頂端"><span class="material-symbols-outlined">expand_less</span></button>

<div class="modal-overlay" id="spotModal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="spot-modal">
    <div class="modal-img-wrap">
      <span class="modal-img-placeholder" id="modalImgPlaceholder"></span>
      <img id="modalImg" src="" alt="" loading="lazy">
      <button class="modal-close" id="spotModalClose" aria-label="關閉"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-info-chip" id="modalInfoChip"></div>
      <a class="modal-map-btn hidden" id="modalMapBtn" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ══════════════ HELPERS ══════════════ */
const icon = n => `<span class="material-symbols-outlined">${n}</span>`;

function actIcon(a) {
  if (/飛抵|機場|起飛/.test(a))                          return icon('flight')+' ';
  if (/搭船|碼頭/.test(a))                               return icon('sailing')+' ';
  if (/搭火車|搭車|火車|搭乘.*車|轉搭|齒軌|鐵路|冰河快車/.test(a)) return icon('train')+' ';
  if (/纜車|Eiger Express|Cliff Walk|步橋/.test(a))      return icon('')+' ';
  if (/公車/.test(a))                                    return icon('directions_bus')+' ';
  if (/[Cc]heck in|入住/.test(a))                        return icon('meeting_room')+' ';
  if (/check out|退房/.test(a))                          return icon('luggage')+' ';
  if (/健行|Dragon Path|Eiger Walk/.test(a))             return icon('hiking')+' ';
  if (/步行|散步|漫步/.test(a))                          return '';
  if (/餐廳|午餐|晚餐|早餐|用餐|吃飯|點餐|起士鍋|Julen/.test(a)) return icon('restaurant')+' ';
  if (/採買|超市|Coop|購物/.test(a))                     return icon('shopping_cart')+' ';
  if (/觀景|觀賞|景台|夜景|日落|倒影/.test(a))           return icon('landscape')+' ';
  if (/湖|Stellisee|Grindjisee|Gruensee|Moosjisee|Leisee|Bachalpsee|Riffelsee/.test(a)) return icon('water')+' ';
  if (/教堂|大教堂/.test(a))                             return icon('church')+' ';
  if (/博物館|展覽|故居|體驗館|冰宮/.test(a))            return icon('museum')+' ';
  if (/觀景台|冰川|Sphinx|Plateau/.test(a))              return icon('terrain')+' ';
  if (/巧克力|Lindt/.test(a))                            return icon('cake')+' ';
  if (/休息|放空|留空/.test(a))                          return icon('self_improvement')+' ';
  return '';
}

function timeToPeriod(t) {
  if (!t || !t.trim()) return null;
  if (/清晨|早上/.test(t)) return '早';
  if (/中午前|中午/.test(t)) return '中';
  if (/下午/.test(t)) return '中';
  if (/日落|傍晚|晚上/.test(t)) return '晚';
  const m = t.match(/^(\d+)/);
  if (!m) return null;
  const h = parseInt(m[1]);
  if (h < 12) return '早';
  if (h < 18) return '中';
  return '晚';
}

const _t = new Date();
const todayKey = `${_t.getMonth()+1}/${_t.getDate()}`;

/* ══════════════ BUILD UI ══════════════ */
const tabBar     = document.getElementById('tabBar');
const tabContent = document.getElementById('tabContent');
let activeIdx = 0;
const todayDayIdx = DAYS.findIndex(d => d.date === todayKey);
if (todayDayIdx !== -1) activeIdx = todayDayIdx;

DAYS.forEach((d, i) => {
  /* ── Tab button ── */
  if (i > 0 && d.region !== DAYS[i-1].region) {
    const div = document.createElement('div');
    div.className = 'tab-divider';
    tabBar.appendChild(div);
  }
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === activeIdx ? ' active' : '');
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected', i === activeIdx ? 'true':'false');
  btn.setAttribute('data-region', d.region);
  btn.setAttribute('data-idx', i);
  btn.innerHTML = `<span class="tb-date">${d.date}</span>`;
  btn.addEventListener('click', () => switchTab(i));
  tabBar.appendChild(btn);

  /* ── Tab panel ── */
  const isToday  = d.date === todayKey;
  const spotKeys = DAY_SPOTS[d.id] || [];

  const chipsHTML = [
    d.duration && d.duration !== '-' ? `<span class="chip dur">${icon('schedule')} ${d.duration}</span>` : '',
    d.stay ? `<span class="chip stay">${icon('hotel')} ${d.stay}${d.stayNote ? ' · '+d.stayNote : ''}</span>` : '',
    ...d.tags.map(t => t.includes('需好天氣') ? `<span class="chip sunny">${icon('wb_sunny')} 需好天氣</span>` : t.includes('強力推薦') ? `<span class="chip rec">${icon('star')} 強力推薦</span>` : '').filter(Boolean),
  ].join('');

  let lastPeriod = null;
  const schedRows = [];
  for (const s of d.schedule) {
    const period = timeToPeriod(s.t);
    if (period !== null && period !== lastPeriod) {
      lastPeriod = period;
      schedRows.push(`<li class="tl-period-header"><span class="tl-period-label">${period}</span><span class="tl-period-line"></span></li>`);
    }
    const actContent = s.link
      ? `${s.pre ? s.pre + ' ' : ''}<a class="tl-map-link" href="${s.link}" target="_blank" rel="noopener">${actIcon(s.a)}${s.a} ${icon('map')}</a>${s.suf ? ' ' + s.suf : ''}`
      : `${s.pre ? s.pre + ' ' : ''}${actIcon(s.a)}${s.a}${s.suf ? ' ' + s.suf : ''}`;
    const rowInner = s.spot
      ? `<div class="tl-act-row"><div class="tl-act">${actContent}</div><button class="spot-info-btn" data-spot="${s.spot}" data-link="${s.link || ''}">${icon('info')} 介紹</button></div>`
      : `<div class="tl-act">${actContent}</div>`;
    schedRows.push(`<li class="tl-item"><span class="tl-dot"></span>${rowInner}</li>`);
  }
  const schedHTML = schedRows.join('');

  const tipsHTML   = d.tips   ? `<div class="info-box tip"><b>${icon('lightbulb')} 提醒</b>${d.tips}</div>` : '';
  const diningHTML = d.dining ? `<div class="info-box dining"><b>${icon('restaurant')} 餐飲</b>${d.dining}</div>` : '';
  const linksHTML  = (d.links && d.links.length) ? `<div class="links-row">${d.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener">${icon('open_in_new')} ${l.label}</a>`).join('')}</div>` : '';

  // Spot cards HTML
  let detailHTML;
  if (spotKeys.length === 0) {
    const msg = d.region === 'transit' ? '今日為移動日，欣賞沿途窗外風景就是最好的景點。' : '今日為返程日，帶著美好的回憶踏上歸途。';
    detailHTML = `<div class="no-spots"><span class="ns-icon">${icon(d.region === 'transit' ? 'train' : 'flight')}</span>${msg}</div>`;
  } else {
    const cards = spotKeys.map(key => {
      const s = SPOT_DATA[key];
      if (!s) return '';
      return `
        <div class="spot-card">
          <div class="spot-img-wrap">
            <span class="spot-img-placeholder">${s.emoji}</span>
            <img src="${s.img}" alt="${s.name}" loading="lazy" onerror="this.style.opacity='0'">
          </div>
          <div class="spot-body">
            <div class="spot-name">${s.name}</div>
            <div class="spot-desc">${s.desc}</div>
            <div class="spot-info-chip">${icon('info')} ${s.info}</div>
            ${s.link ? `<a class="spot-map-link" href="${s.link}" target="_blank" rel="noopener">${icon('map')} 在地圖上查看</a>` : ''}
          </div>
        </div>`;
    }).join('');
    detailHTML = `<div class="spot-grid">${cards}</div>`;
  }

  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i === activeIdx ? ' active' : '');
  panel.setAttribute('role','tabpanel');
  panel.setAttribute('data-idx', i);

  panel.innerHTML = `
    <div class="day-nav-arrows">
      <button class="nav-arrow prev" data-dir="-1" ${i===0?'disabled':''}>${icon('arrow_back_ios')} ${i>0?DAYS[i-1].date:''}</button>
      <span class="day-counter">第 ${i+1} 天 / 共 ${DAYS.length} 天</span>
      <button class="nav-arrow next" data-dir="1" ${i===DAYS.length-1?'disabled':''}>${i<DAYS.length-1?DAYS[i+1].date:''} ${icon('arrow_forward_ios')}</button>
    </div>

    <div class="panel-banner" data-region="${d.region}">
      <div class="banner-date">
        <span class="banner-daynum">${d.date}</span>
        <span class="banner-dow">（${d.dow}）</span>
      </div>
      <div class="banner-info">
        <div class="banner-loc">${d.location}${isToday?'<span class="today-badge">TODAY</span>':''}</div>
        <div class="banner-sum">${d.summary}</div>
      </div>
    </div>

    ${chipsHTML ? `<div class="chips-row">${chipsHTML}</div>` : ''}

    <div class="sub-tab-bar">
      <button class="sub-tab-btn active" data-sub="overview"><span class="material-symbols-outlined">list_alt</span> 行程簡介</button>
      <button class="sub-tab-btn" data-sub="detail"><span class="material-symbols-outlined">photo_camera</span> 景點詳細</button>
    </div>

    <div class="sub-panel overview active">
      <div class="sec-label">時間軸</div>
      <div class="sched-card"><ul class="timeline">${schedHTML}</ul></div>
      ${diningHTML}${tipsHTML}${linksHTML}
    </div>

    <div class="sub-panel detail">
      ${detailHTML}
    </div>`;

  // Prev / next
  panel.querySelectorAll('.nav-arrow').forEach(b => {
    b.addEventListener('click', () => switchTab(i + parseInt(b.getAttribute('data-dir'), 10)));
  });

  // Sub-tab switching
  panel.querySelectorAll('.sub-tab-btn').forEach(sb => {
    sb.addEventListener('click', () => {
      panel.querySelectorAll('.sub-tab-btn').forEach(x => x.classList.remove('active'));
      panel.querySelectorAll('.sub-panel').forEach(x => x.classList.remove('active'));
      sb.classList.add('active');
      panel.querySelector(`.sub-panel.${sb.dataset.sub}`).classList.add('active');
    });
  });

  tabContent.appendChild(panel);
});

/* ══════════════ NOTES TAB ══════════════ */
const notesDivider = document.createElement('div');
notesDivider.className = 'tab-divider';
tabBar.appendChild(notesDivider);

const notesBtn = document.createElement('button');
notesBtn.id = 'notesTabBtn';
notesBtn.className = 'tab-btn';
notesBtn.setAttribute('role','tab');
notesBtn.setAttribute('aria-selected','false');
notesBtn.setAttribute('data-region','notes');
notesBtn.innerHTML = `<span class="tb-date"><span class="material-symbols-outlined">edit_note</span></span><span class="tb-dot">備忘</span>`;
tabBar.appendChild(notesBtn);

const notesPanel = document.createElement('div');
notesPanel.id = 'notesPanel';
notesPanel.className = 'notes-panel';
notesPanel.setAttribute('role','tabpanel');
notesPanel.innerHTML = `
  <p class="note-sec-label">穿搭與防曬</p>

  <div class="note-card tip">
    <div class="note-card-h"><span class="material-symbols-outlined">layers</span> 洋蔥式穿搭</div>
    <p>不要因為氣象預報 16–24°C 就全帶長袖——歐洲只要有太陽，體感直接飆破 30°C！</p>
    <ul>
      <li><strong>市區 / 健行中</strong>　短袖、短褲、涼爽洋裝（沒帶短褲真的會想在當地現買）</li>
      <li><strong>上山行進間</strong>（策馬特、皮拉圖斯、Gornergrat）　短袖 + 薄外套 / 風衣</li>
      <li><strong>靜止或沒太陽時</strong>　風很大（可能剩 8°C）：無袖/短袖 + 針織外套 + 防風外套，怕冷再加輕羽絨背心</li>
    </ul>
    <p style="margin-top:8px"><strong>關鍵重點：「防風」比穿得厚更重要</strong>，把脖子、手臂等露出來的肌膚包好，風就灌不進去。</p>
  </div>

  <div class="note-card warn">
    <div class="note-card-h"><span class="material-symbols-outlined">wb_sunny</span> 防曬超重要！</div>
    <p>歐洲紫外線不是開玩笑，連坐火車都會曬傷！</p>
    <ul>
      <li><strong>必備三件套</strong>　墨鏡、遮陽帽（或陽傘）、防曬乳</li>
      <li><strong>重災區</strong>　鼻子、耳朵、手臂、頭頂（髮量稀疏務必戴帽）</li>
      <li>記得定時<strong>補擦防曬</strong>，尤其健行途中大量流汗後</li>
    </ul>
  </div>

  <p class="note-sec-label">行程整體</p>

  <div class="note-card tip">
    <div class="note-card-h"><span class="material-symbols-outlined">confirmation_number</span> Swiss Travel Pass（STP）</div>
    <ul>
      <li>涵蓋瑞士全國火車、大部分湖船、城市公車 / 電車 / 地鐵</li>
      <li>部分山岳鐵路享 50% 折扣或免費（皮拉圖斯齒軌火車需另購）</li>
      <li>少女峰區：Eiger Express 纜車免費，Jungfraubahn 鐵路需另購並強制訂位</li>
      <li>出發前在 <strong>SBB App</strong> 下載電子 Pass QR code 備用</li>
    </ul>
  </div>

  <div class="note-card tip">
    <div class="note-card-h"><span class="material-symbols-outlined">smartphone</span> 必備 App</div>
    <ul>
      <li><strong>SBB Mobile</strong> — 瑞士國鐵官方，查班次 / 訂位 / 電子票</li>
      <li><strong>Swisstopo</strong> — 瑞士官方地圖，健行路線可離線下載</li>
      <li><strong>SwitzerlandMobility</strong> — 健行路線（含五湖路線 No.11）</li>
      <li><strong>MeteoSwiss</strong> — 瑞士官方天氣，高山天氣最準確</li>
      <li><strong>Matterhorn App</strong> — 策馬特官方旅遊 App—— 查即時影像與纜車</li>
    </ul>
  </div>

  <p class="note-sec-label">需晴天景點備案</p>

  <div class="note-card warn">
    <div class="note-card-h"><span class="material-symbols-outlined">wb_sunny</span> 五個需好天氣日</div>
    <ul>
      <li><strong>6/18（四）</strong> 戈爾納格拉特 → 備案：策馬特村落漫步、馬特洪峰博物館</li>
      <li><strong>6/19（五）</strong> 五湖健行 → 備案：Klein Matterhorn（Glacier Paradise）</li>
      <li><strong>6/20（六）</strong> 移動日，備案影響較小</li>
      <li><strong>6/21（日）</strong> 少女峰 → 提前 1–2 天看 jungfrau.ch，差時可考慮換日</li>
      <li><strong>6/22（一）</strong> First 高山 → 備案：格林德瓦低海拔健行或河畔散步</li>
    </ul>
  </div>

  <p class="note-sec-label">健康與安全</p>

  <div class="note-card alert">
    <div class="note-card-h"><span class="material-symbols-outlined">terrain</span> 高山症注意事項</div>
    <ul>
      <li>高危景點：少女峰 3,454m、戈爾納格拉特 3,089m</li>
      <li>症狀：頭痛、噁心、頭暈、呼吸急促</li>
      <li>預防：緩慢移動、多喝水、不飲酒；有症狀立即下山</li>
      <li>建議備：頭痛藥、保暖外套（山頂約 0–10°C）</li>
    </ul>
  </div>

  <p class="note-sec-label">當地生活</p>

  <div class="note-card">
    <div class="note-card-h"><span class="material-symbols-outlined">payments</span> 貨幣與刷卡</div>
    <ul>
      <li>貨幣：瑞士法郎（CHF），大部分場所接受 Visa / Mastercard</li>
      <li>超市（Coop / Migros）、山區纜車站建議備少量現金</li>
      <li>小費非強制，滿意服務可多給 5–10%</li>
    </ul>
  </div>

  <div class="note-card">
    <div class="note-card-h"><span class="material-symbols-outlined">power</span> 插頭與電壓</div>
    <ul>
      <li>插頭型號：Type J（三圓腳），需準備轉接頭</li>
      <li>電壓 230V / 50Hz；台灣 100–240V 電器可直接使用</li>
      <li>建議攜帶多孔延長線，飯店插座通常只有 1–2 個</li>
    </ul>
  </div>

  <div class="note-card">
    <div class="note-card-h"><span class="material-symbols-outlined">no_crash</span> 策馬特無燃油車小鎮</div>
    <p>策馬特禁止燃油私家車進入。自駕旅客需在 Täsch 停車後轉搭電動接駁小火車（約 12 分鐘，CHF 18 來回）。持 Swiss Travel Pass 搭乘一般火車直接進站不受影響。</p>
  </div>

  <p class="note-sec-label">哪些地方需要現金？</p>

  <div class="note-card warn">
    <div class="note-card-h"><span class="material-symbols-outlined">universal_currency</span> 建議備 100–150 CHF 現金</div>
    <ul>
      <li><strong>城市稅（住宿）</strong>　Airbnb / 公寓式酒店常規定只能付現；一般飯店通常可刷卡</li>
      <li><strong>上廁所</strong>　部分公廁需投幣 CHF 2（如五湖健行沿線）；冰川天堂 CHF 2 可刷卡</li>
      <li><strong>行李寄放</strong>　部分寄物櫃只接受硬幣投幣</li>
      <li><strong>紀念幣機台</strong>　壓紀念幣 / 買零紙鈔只能現金</li>
      <li><strong>小額消費</strong>　少數紀念品店金額低於 CHF 10 拒絕刷卡</li>
      <li><strong>策馬特可麗餅攤</strong>　超人氣街頭小吃，僅收現金 🥞</li>
      <li><strong>龍疆牛奶站</strong>　特色地標自助購買，需現金 🥛</li>
      <li><strong>皮拉圖斯相機綁帶押金</strong>　租借需現金押金 CHF 50 📸</li>
      <li><strong>超市推車</strong>　部分 Coop / Migros 需投硬幣使用推車</li>
      <li><strong>自助洗衣機</strong>　外出洗衣通常只能投幣</li>
      <li><strong>停車費</strong>　投幣式停車格（建議下載 <strong>Parkingpay</strong> App 綁卡繳費）🚗</li>
    </ul>
  </div>

  <p class="note-sec-label">緊急聯絡</p>

  <div class="note-card alert">
    <div class="note-card-h"><span class="material-symbols-outlined">emergency</span> 緊急電話</div>
    <ul>
      <li><strong>警察</strong>　117</li>
      <li><strong>救護車</strong>　144</li>
      <li><strong>山難空中救援 REGA</strong>　1414</li>
      <li><strong>消防</strong>　118</li>
      <li><strong>歐盟通用緊急</strong>　112</li>
    </ul>
  </div>
`;
tabContent.appendChild(notesPanel);

notesBtn.addEventListener('click', () => {
  activeIdx = -1;
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  hotelPanel.classList.remove('active');
  notesBtn.classList.add('active');
  notesBtn.setAttribute('aria-selected','true');
  notesPanel.classList.add('active');
  notesBtn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  window.scrollTo({top: document.getElementById('tabBar').offsetTop - 1, behavior:'smooth'});
});

/* ══════════════ HOTEL TAB ══════════════ */
const hotelBtn = document.createElement('button');
hotelBtn.id = 'hotelTabBtn';
hotelBtn.className = 'tab-btn';
hotelBtn.setAttribute('role','tab');
hotelBtn.setAttribute('aria-selected','false');
hotelBtn.setAttribute('data-region','hotel');
hotelBtn.innerHTML = `<span class="tb-date"><span class="material-symbols-outlined">hotel</span></span><span class="tb-dot">住宿</span>`;
tabBar.appendChild(hotelBtn);

const hotelPanel = document.createElement('div');
hotelPanel.id = 'hotelPanel';
hotelPanel.className = 'hotel-panel';
hotelPanel.setAttribute('role','tabpanel');

function breakfastText(b) {
  if (b === true)  return '含早餐';
  if (b === false) return '不含早餐';
  if (b === '自費') return '早餐自費';
  return '早餐資訊未填';
}

hotelPanel.innerHTML = HOTELS.map(h => `
  <div class="hotel-card">
    <div class="hotel-img-wrap">
      ${h.img
        ? `<img src="${h.img}" alt="${h.name}" loading="lazy">`
        : `<div class="hotel-img-placeholder">${icon('add_photo_alternate')} 尚未新增照片</div>`}
    </div>
    <div class="hotel-body">
      <div class="hotel-header">
        <div class="hotel-name">${h.name}</div>
        <span class="hotel-badge">${h.location} · ${h.nights} 晚</span>
      </div>
      <div class="hotel-row">${icon('calendar_month')} ${h.checkIn} 入住 → ${h.checkOut} 退房</div>
      <div class="hotel-row">${icon('free_breakfast')} ${breakfastText(h.breakfast)}</div>
      ${h.notes ? `<div class="hotel-row">${icon('info')} ${h.notes}</div>` : ''}
      ${h.mapLink ? `<a class="hotel-map-btn" href="${h.mapLink}" target="_blank" rel="noopener">${icon('map')} 在地圖上查看</a>` : ''}
    </div>
  </div>`).join('');

tabContent.appendChild(hotelPanel);

hotelBtn.addEventListener('click', () => {
  activeIdx = -1;
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  notesPanel.classList.remove('active');
  hotelBtn.classList.add('active');
  hotelBtn.setAttribute('aria-selected','true');
  hotelPanel.classList.add('active');
  hotelBtn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  window.scrollTo({top: document.getElementById('tabBar').offsetTop - 1, behavior:'smooth'});
});

/* ══════════════ SWITCH TAB ══════════════ */
function switchTab(idx) {
  if (idx < 0 || idx >= DAYS.length) return;
  activeIdx = idx;
  notesPanel.classList.remove('active');
  notesBtn.classList.remove('active');
  notesBtn.setAttribute('aria-selected','false');
  hotelPanel.classList.remove('active');
  hotelBtn.classList.remove('active');
  hotelBtn.setAttribute('aria-selected','false');
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
    b.setAttribute('aria-selected', i === idx ? 'true':'false');
  });
  document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  const nb = document.querySelector(`.tab-btn[data-idx="${idx}"]`);
  if (nb) nb.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  window.scrollTo({top: document.getElementById('tabBar').offsetTop - 1, behavior:'smooth'});
}

/* ── Keyboard nav ── */
tabBar.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); switchTab(activeIdx + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); switchTab(activeIdx - 1); }
  if (e.key === 'Home')       { e.preventDefault(); switchTab(0); }
  if (e.key === 'End')        { e.preventDefault(); switchTab(DAYS.length - 1); }
});

/* ── Back to top ── */
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => backTop.classList.toggle('visible', window.scrollY > 500), {passive:true});
backTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

/* ══════════════ SPOT INFO MODAL ══════════════ */
const spotModal    = document.getElementById('spotModal');
const spotModalClose = document.getElementById('spotModalClose');

function openSpotModal(spotKey, mapLink) {
  const s = SPOT_DATA[spotKey];
  if (!s) return;
  const img = document.getElementById('modalImg');
  const placeholder = document.getElementById('modalImgPlaceholder');
  placeholder.textContent = s.emoji;
  img.style.opacity = '1';
  img.src = '';
  img.alt = s.name;
  img.onerror = () => { img.style.opacity = '0'; };
  img.src = s.img;
  document.getElementById('modalName').textContent  = s.name;
  document.getElementById('modalDesc').innerHTML  = s.desc;
  document.getElementById('modalInfoChip').innerHTML = icon('schedule') + ' ' + s.info;
  const mapBtn  = document.getElementById('modalMapBtn');
  const finalLink = mapLink || s.link || '';
  if (finalLink) {
    mapBtn.href = finalLink;
    mapBtn.innerHTML = icon('map') + ' 在地圖上查看';
    mapBtn.classList.remove('hidden');
  } else {
    mapBtn.classList.add('hidden');
  }
  spotModal.classList.add('open');
  spotModal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeSpotModal() {
  spotModal.classList.remove('open');
  spotModal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

spotModalClose.addEventListener('click', closeSpotModal);
spotModal.addEventListener('click', e => { if (e.target === spotModal) closeSpotModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSpotModal(); });

tabContent.addEventListener('click', e => {
  const btn = e.target.closest('.spot-info-btn');
  if (btn) openSpotModal(btn.dataset.spot, btn.dataset.link);
});
</script>
</body>
</html>
